name: Provision Oracle Ampere A1

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: oci-ampere-launch
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI CLI
        run: |
          pip install oci-cli

      - name: Configure OCI Authentication
        env:
          OCI_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_FP: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REG: ${{ secrets.OCI_REGION }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat << CONFIG_EOF > ~/.oci/config
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FP
          tenancy=$OCI_TENANCY
          region=$OCI_REG
          key_file=~/.oci/oci_api_key.pem
          CONFIG_EOF

      - name: Check Existing Instances & Launch
        id: provision
        env:
          TENANCY_ID: ${{ secrets.OCI_TENANCY_OCID }}
          SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SSH_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > ./ssh_authorized_key.pub

          # 8 attempts spaced ~30 seconds apart (~4 minutes total per run)
          TOTAL_ATTEMPTS=8
          SLEEP_SECONDS=30

          for ((i=1; i<=TOTAL_ATTEMPTS; i++)); do
            echo "=========================================="
            echo "Attempt $i of $TOTAL_ATTEMPTS [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            echo "=========================================="

            # Check if an Ampere A1 instance already exists
            EXISTING=$(oci compute instance list \
              --compartment-id "$TENANCY_ID" \
              --lifecycle-state "RUNNING" \
              --lifecycle-state "PROVISIONING" \
              --query 'data[?contains("shape", `A1.Flex`)]' 2>/dev/null | jq 'length // 0' 2>/dev/null || echo "0")

            if [ "${EXISTING:-0}" -gt 0 ]; then
              echo "An Ampere A1 instance is already running or provisioning ($EXISTING found). Exiting cleanly."
              echo "success=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # 1. CONTENDER 1: Attempt 4 OCPUs / 24 GB RAM / 100 GB Boot Disk
            echo "Attempting Contender 1: 4 OCPUs / 24 GB RAM / 100 GB Disk..."
            RESP_4C=$(oci compute instance launch \
              --max-attempts 1 \
              --availability-domain "$AD_NAME" \
              --compartment-id "$TENANCY_ID" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":4,"memoryInGBs":24}' \
              --image-id "$IMAGE_ID" \
              --subnet-id "$SUBNET_ID" \
              --assign-public-ip true \
              --boot-volume-size-in-gbs 100 \
              --display-name "Altime-4C24G" \
              --ssh-authorized-keys-file ./ssh_authorized_key.pub 2>&1 || true)

            if echo "$RESP_4C" | grep -q '"lifecycle-state": "PROVISIONING"'; then
              echo "SUCCESS: 4 OCPU / 24 GB RAM machine created!"
              INSTANCE_ID=$(echo "$RESP_4C" | jq -r '.data.id')
              echo "success=true" >> "$GITHUB_OUTPUT"
              echo "config=4 OCPUs / 24 GB RAM / 100 GB Storage" >> "$GITHUB_OUTPUT"
              echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "4 OCPU unavailable. Falling back to Contender 2..."

            # 2. CONTENDER 2: Attempt 2 OCPUs / 12 GB RAM / 100 GB Boot Disk
            echo "Attempting Contender 2: 2 OCPUs / 12 GB RAM / 100 GB Disk..."
            RESP_2C=$(oci compute instance launch \
              --max-attempts 1 \
              --availability-domain "$AD_NAME" \
              --compartment-id "$TENANCY_ID" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --image-id "$IMAGE_ID" \
              --subnet-id "$SUBNET_ID" \
              --assign-public-ip true \
              --boot-volume-size-in-gbs 100 \
              --display-name "Altime-2C12G" \
              --ssh-authorized-keys-file ./ssh_authorized_key.pub 2>&1 || true)

            if echo "$RESP_2C" | grep -q '"lifecycle-state": "PROVISIONING"'; then
              echo "SUCCESS: 2 OCPU / 12 GB RAM machine created!"
              INSTANCE_ID=$(echo "$RESP_2C" | jq -r '.data.id')
              echo "success=true" >> "$GITHUB_OUTPUT"
              echo "config=2 OCPUs / 12 GB RAM / 100 GB Storage" >> "$GITHUB_OUTPUT"
              echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Both configurations out of capacity on attempt $i."
            if [ "$i" -lt "$TOTAL_ATTEMPTS" ]; then
              echo "Waiting ${SLEEP_SECONDS}s before attempt $((i+1))..."
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "Run completed: no capacity found across $TOTAL_ATTEMPTS attempts. Next scheduled run will take over shortly."
          echo "success=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Send Email Notification on Success
        if: steps.provision.outputs.success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🎉 Oracle Ampere A1 Instance Successfully Provisioned!',
              body: `Hello @${context.repo.owner},\n\nYour Oracle Cloud Ampere A1 instance has been successfully provisioned!\n\n- **Configuration**: ${{ steps.provision.outputs.config }}\n- **Boot Volume**: 100 GB\n- **Instance OCID**: \`${{ steps.provision.outputs.instance_id }}\`\n- **Status**: Provisioning / Running\n\nLog in to your Oracle Cloud Console to check your public IP and connect.`
            });
