name: Provision Oracle Ampere A1

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: oci-ampere-launch
  cancel-in-progress: false

permissions:
  issues: write
  contents: read
  actions: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI CLI
        run: |
          pip install oci-cli

      - name: Configure OCI Authentication
        env:
          OCI_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_FP: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REG: ${{ secrets.OCI_REGION }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat << CONFIG_EOF > ~/.oci/config
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FP
          tenancy=$OCI_TENANCY
          region=$OCI_REG
          key_file=~/.oci/oci_api_key.pem
          CONFIG_EOF

      - name: Multi-Instance Quota Provisioner (5h 15m)
        id: provision
        env:
          TENANCY_ID: ${{ secrets.OCI_TENANCY_OCID }}
          SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SSH_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          printf '%s\n' "$SSH_KEY" > ./ssh_authorized_key.pub

          # Pre-fetch Availability Domain and ARM Image
          AD_NAME=$(oci iam availability-domain list --query 'data[0].name' --raw-output 2>/dev/null || true)
          if [ -z "$AD_NAME" ] || [ "$AD_NAME" = "null" ]; then
            AD_NAME="yNXx:AP-MUMBAI-1-AD-1"
          fi

          IMAGE_ID=$(oci compute image list \
            --compartment-id "$TENANCY_ID" \
            --operating-system "Canonical Ubuntu" \
            --operating-system-version "24.04" \
            --shape "VM.Standard.A1.Flex" \
            --sort-by TIMECREATED --sort-order DESC \
            --query 'data[0].id' --raw-output 2>/dev/null || true)

          if [ -z "$IMAGE_ID" ] || [ "$IMAGE_ID" = "null" ] || [ "$IMAGE_ID" = "None" ]; then
            IMAGE_ID="ocid1.image.oc1.ap-mumbai-1.aaaaaaaa5ybbcji7iwefoo2juley7gyh4yc6ht55nke2ujga76irm77q5pma"
          fi

          echo "Target AD: $AD_NAME"
          echo "Target Image ID: $IMAGE_ID"

          try_launch() {
            local ocpus=$1
            local ram=$2
            local vm_num=$3

            echo "  -> Trying ${ocpus} OCPU / ${ram} GB RAM (VM #${vm_num})..."
            local resp=$(oci compute instance launch \
              --max-attempts 1 \
              --availability-domain "$AD_NAME" \
              --compartment-id "$TENANCY_ID" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config "{\"ocpus\":$ocpus,\"memoryInGBs\":$ram}" \
              --image-id "$IMAGE_ID" \
              --subnet-id "$SUBNET_ID" \
              --assign-public-ip true \
              --boot-volume-size-in-gbs 50 \
              --display-name "Altime-VM${vm_num}-${ocpus}C${ram}G" \
              --ssh-authorized-keys-file ./ssh_authorized_key.pub 2>&1 || true)

            if echo "$resp" | grep -q '"lifecycle-state": "PROVISIONING"'; then
              local inst_id=$(echo "$resp" | jq -r '.data.id')
              echo "  🎉 SUCCESS: VM #${vm_num} (${ocpus} OCPU / ${ram} GB RAM) created!"
              
              gh issue create \
                --assignee "$REPO_OWNER" \
                --title "🎉 Oracle Ampere A1 VM #${vm_num} Provisioned (${ocpus}C / ${ram}G)!" \
                --body "$(printf 'Hello @%s,\n\nYour Oracle Cloud Ampere A1 instance has been successfully provisioned!\n\n- **Instance**: VM #%s\n- **Configuration**: %s OCPUs / %s GB RAM / 50 GB Boot Disk\n- **Instance OCID**: `%s`\n- **Status**: Provisioning / Running\n\nLog in to your Oracle Cloud Console to view your public IP and connect.' "$REPO_OWNER" "$vm_num" "$ocpus" "$ram" "$inst_id")" || true

              return 0
            fi
            echo "     Unavailable: Out of host capacity"
            return 1
          }

          START_TIME=$(date +%s)
          MAX_DURATION=18900
          SLEEP_SECONDS=35
          ATTEMPT=0

          echo "Starting 5h 15m continuous quota-maximizing loop..."

          while [ $(($(date +%s) - START_TIME)) -lt $MAX_DURATION ]; do
            ATTEMPT=$((ATTEMPT + 1))
            ELAPSED_MINS=$(( ($(date +%s) - START_TIME) / 60 ))
            echo "--------------------------------------------------------"
            echo "Attempt #$ATTEMPT (Elapsed: ${ELAPSED_MINS}m) [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"

            # Query current active/provisioning Ampere instances
            INSTANCES=$(oci compute instance list \
              --compartment-id "$TENANCY_ID" \
              --lifecycle-state "RUNNING" \
              --lifecycle-state "PROVISIONING" \
              --query 'data[?contains("shape", `A1.Flex`)]' 2>/dev/null || echo "[]")

            INSTANCE_COUNT=$(echo "$INSTANCES" | jq 'if . == null then 0 else length end')
            USED_OCPUS=$(echo "$INSTANCES" | jq '[.[] | (.["shape-config"].ocpus // .shapeConfig.ocpus // 0)] | add // 0' | awk '{print int($1)}')
            USED_RAM=$(echo "$INSTANCES" | jq '[.[] | (.["shape-config"]["memory-in-gbs"] // .shapeConfig.memoryInGBs // 0)] | add // 0' | awk '{print int($1)}')

            REMAINING_OCPUS=$((4 - USED_OCPUS))
            REMAINING_RAM=$((24 - USED_RAM))

            echo "Current Usage: ${INSTANCE_COUNT} instances, ${USED_OCPUS}/4 OCPUs, ${USED_RAM}/24 GB RAM"
            echo "Remaining Quota: ${REMAINING_OCPUS} OCPUs, ${REMAINING_RAM} GB RAM"

            # Check if all free tier quota is already claimed
            if [ "$REMAINING_OCPUS" -le 0 ] || [ "$INSTANCE_COUNT" -ge 2 ]; then
              echo "✅ Full Always-Free capacity reached ($USED_OCPUS OCPUs, $USED_RAM GB RAM across $INSTANCE_COUNT instances). Quota complete!"
              exit 0
            fi

            VM_NUM=$((INSTANCE_COUNT + 1))
            PROVISIONED=0

            # 1. Try 4 OCPU / 24 GB RAM (if entire quota is free)
            if [ "$REMAINING_OCPUS" -ge 4 ] && [ "$REMAINING_RAM" -ge 24 ]; then
              if try_launch 4 24 "$VM_NUM"; then
                PROVISIONED=1
              fi
            fi

            # 2. Try 2 OCPU / 12 GB RAM
            if [ "$PROVISIONED" -eq 0 ] && [ "$REMAINING_OCPUS" -ge 2 ] && [ "$REMAINING_RAM" -ge 12 ]; then
              if try_launch 2 12 "$VM_NUM"; then
                PROVISIONED=1
              fi
            fi

            # 3. Try 1 OCPU / 6 GB RAM
            if [ "$PROVISIONED" -eq 0 ] && [ "$REMAINING_OCPUS" -ge 1 ] && [ "$REMAINING_RAM" -ge 6 ]; then
              if try_launch 1 6 "$VM_NUM"; then
                PROVISIONED=1
              fi
            fi

            if [ "$PROVISIONED" -eq 1 ]; then
              echo "VM provisioned! Checking if additional free quota remains..."
              sleep 10
              continue
            fi

            echo "All candidates out of capacity. Sleeping ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
          done

          echo "Target duration (5h 15m) reached. Dispatching next relay run..."
          gh workflow run provision.yml || echo "Cron fallback will trigger next run."
          exit 0
